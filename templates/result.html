<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2rem;
        }
        p {
            font-size: 1.2rem;
            color: #555;
        }
        .prediction {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a73e8;
            margin-top: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            background-color: #1a73e8;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0c59b6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prediction Result</h1>
        <p>Predicted Class: <span class="prediction">{{ predicted_class }}</span></p>
        <h2>Prediction Confidence</h2>
        <img src="{{ chart_url }}" alt="Prediction Chart">
        <br>
        <a href="/" class="btn">Upload Another Image</a>
    </div>
</body>
</html>
