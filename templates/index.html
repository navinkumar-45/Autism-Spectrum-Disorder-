
<!DOCTYPE html>
<html>
<head>
    <title>Image Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        input[type="file"] {
            display: block;
            margin: 20px auto;
            padding: 10px;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1 id="upload-title">Upload Image for Prediction</h1>
    <form action="/" method="post" enctype="multipart/form-data" class="image-upload-form">
        <input type="file" name="file" accept="image/*" id="file-input">
        <input type="submit" value="Upload" id="submit-button">
    </form>
</body>
</html>
